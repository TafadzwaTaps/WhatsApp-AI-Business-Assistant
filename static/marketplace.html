<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WaziBot — Business Directory</title>
<meta name="description" content="Discover real businesses selling on WhatsApp — browse menus, shop products, and book services, all powered by WaziBot AI."/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0f0d;--surface:#111a15;--surface2:#172010;--border:#1f3025;
  --green:#22c55e;--green-dim:#16a34a;--green-glow:rgba(34,197,94,.15);
  --text:#e8f5e9;--text-dim:#6b8f71;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
  overflow-x:hidden;}

/* Ambient background texture — subtle unique touch, not a flat black page */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 10%, rgba(34,197,94,.10), transparent 40%),
    radial-gradient(circle at 85% 0%, rgba(167,139,250,.08), transparent 35%),
    radial-gradient(circle at 50% 100%, rgba(34,197,94,.06), transparent 45%);
}

nav{position:sticky;top:0;z-index:50;background:rgba(10,15,13,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:0 24px;height:58px;display:flex;align-items:center;gap:16px;}
.logo{font-size:20px;font-weight:800;color:var(--green);text-decoration:none;}
.nav-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;display:flex;align-items:center;gap:6px;}
.nav-count .dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}

.hero{position:relative;z-index:1;padding:56px 24px 36px;text-align:center;}
.hero-eyebrow{font-family:var(--mono);font-size:10px;color:var(--green);
  text-transform:uppercase;letter-spacing:3px;margin-bottom:14px;
  display:inline-flex;align-items:center;gap:8px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hero h1{font-size:clamp(30px,5.5vw,48px);font-weight:800;margin-bottom:12px;
  letter-spacing:-.5px;}
.hero h1 span{color:var(--green);position:relative;}
.hero p{font-family:var(--mono);font-size:13px;color:var(--text-dim);margin-bottom:28px;
  max-width:480px;margin-left:auto;margin-right:auto;line-height:1.6;}
.search-wrap{max-width:520px;margin:0 auto;position:relative;}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px 14px 44px;color:var(--text);
  font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.search-input:focus{border-color:var(--green-dim);box-shadow:0 0 0 3px var(--green-glow);}
.search-input::placeholder{color:var(--text-dim);}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:15px;}

.container{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 24px 72px;}
.section-label{font-family:var(--mono);font-size:10px;color:var(--green);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
.category-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.cat-btn{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:7px 15px;font-family:var(--mono);font-size:11px;color:var(--text-dim);
  cursor:pointer;transition:all .15s;white-space:nowrap;}
.cat-btn:hover{border-color:var(--green-dim);color:var(--text);}
.cat-btn.active{background:var(--green-dim);color:#000;border-color:var(--green-dim);font-weight:700;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:18px;}

/* Card — each card's border/glow/CTA uses the BUSINESS'S OWN accent colour
   (theme_colour), set via --card-accent inline per card. This is the
   "unique touch": every business looks distinctly itself rather than a
   templated grey box, mirroring their real storefront branding. */
.card{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:22px;cursor:pointer;text-decoration:none;display:block;
  overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;}
.card::after{content:"";position:absolute;top:-40%;right:-30%;width:65%;height:65%;
  background:radial-gradient(circle,var(--card-accent,var(--green)) 0%,transparent 70%);
  opacity:0;transition:opacity .3s;pointer-events:none;filter:blur(10px);}
.card:hover{transform:translateY(-5px);border-color:var(--card-accent,var(--green-dim));
  box-shadow:0 16px 40px -12px rgba(0,0,0,.5);}
.card:hover::after{opacity:.18;}

.card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;position:relative;z-index:1;}
.card-icon{width:48px;height:48px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:21px;flex-shrink:0;overflow:hidden;transition:transform .25s;}
.card:hover .card-icon{transform:scale(1.06) rotate(-2deg);}
.card-icon img{width:100%;height:100%;object-fit:cover;}
.card-heading{min-width:0;flex:1;}
.card-name{font-size:16px;font-weight:700;margin-bottom:3px;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-category{font-family:var(--mono);font-size:10px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:.8px;}
.live-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:9px;color:var(--card-accent,var(--green));font-weight:700;flex-shrink:0;
  background:rgba(34,197,94,.14);border-radius:10px;padding:3px 8px;}
.live-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--card-accent,var(--green));
  box-shadow:0 0 6px var(--card-accent,var(--green));animation:pulse 2s infinite;}

.card-tagline{font-size:13px;color:var(--text-dim);line-height:1.55;margin-bottom:16px;
  position:relative;z-index:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

.card-cta{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:12px;font-weight:700;color:var(--card-accent,var(--green));position:relative;z-index:1;}
.card-cta .arrow{display:inline-block;transition:transform .25s;}
.card:hover .card-cta .arrow{transform:translateX(4px);}

.empty{text-align:center;padding:72px 24px;font-family:var(--mono);
  font-size:13px;color:var(--text-dim);}
.empty .big{font-size:40px;margin-bottom:14px;}
.loading{text-align:center;padding:72px;font-family:var(--mono);color:var(--text-dim);}
.spinner{display:inline-block;width:22px;height:22px;border:2px solid var(--border);
  border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Skeleton loading cards — feels far more polished than a bare spinner */
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:22px;height:168px;position:relative;overflow:hidden;}
.skeleton-card::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  transform:translateX(-100%);animation:shimmer 1.6s infinite;}
@keyframes shimmer{100%{transform:translateX(100%);}}

.footer-note{text-align:center;margin-top:48px;font-family:var(--mono);font-size:11px;
  color:var(--text-dim);position:relative;z-index:1;}
.footer-note a{color:var(--green);text-decoration:none;}

@media(max-width:600px){.hero{padding:40px 16px 24px;}.container{padding:0 16px 56px;}
  .grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">WaziBot</a>
  <span class="nav-sub">Business Directory</span>
  <span class="nav-count" id="nav-count"><span class="dot"></span> Loading…</span>
</nav>

<div class="hero">
  <div class="hero-eyebrow"><span class="dot"></span> Live on WhatsApp right now</div>
  <h1>Discover <span>WhatsApp Businesses</span></h1>
  <p>Real menus, real products, real bookings — every business here replies instantly.
     Find something you like and start chatting in seconds.</p>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search" type="text"
           placeholder="Search businesses, products, services…" oninput="filterBusinesses()"/>
  </div>
</div>

<div class="container">
  <div id="category-bar" class="category-bar"></div>
  <div class="section-label" id="biz-count"></div>
  <div id="grid" class="grid">
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>
  <div class="footer-note">Own a business? <a href="/static/signup.html">List it free on WaziBot →</a></div>
</div>

<script>
const API   = '';
let _all    = [];
let _active = 'All';

const CAT_ICONS = {
  'restaurant':'🍽️','fast food':'🍔','cafe':'☕','café':'☕','coffee':'☕',
  'bakery':'🍞','cake':'🎂','pizza':'🍕','ice cream':'🍦','juice':'🧃',
  'smoothie':'🥤','food truck':'🚚','bbq':'🍖','catering':'🍱','grocery':'🛒',
  'butchery':'🥩','liquor':'🍷','supermarket':'🛒',
  'hardware':'🔧','electronics':'📱','furniture':'🛋️','clothing':'👕',
  'boutique':'👗','shoe':'👟','cosmetic':'💄','perfume':'🧴','toy':'🧸',
  'bookstore':'📚','gift':'🎁','mobile':'📱','computer':'💻','vape':'💨',
  'pet':'🐾','flower':'🌸','jewelry':'💍','sports equipment':'🏅',
  'salon':'💇','barber':'💈','nail':'💅','spa':'🧖','massage':'💆',
  'makeup':'💄','tattoo':'🎨','skincare':'🧴','beauty':'💄',
  'clinic':'🏥','dental':'🦷','dentist':'🦷','pharmacy':'💊','optical':'👓',
  'physiotherapist':'🩺','veterinary':'🐕','wellness':'🌿','hospital':'🏥',
  'car':'🚗','mechanic':'🔧','tire':'🛞','auto':'🚘','driving school':'🚦',
  'plumber':'🔧','electrician':'💡','cleaning':'🧹','pest control':'🐛',
  'locksmith':'🔑','renovation':'🏗️','builder':'🏗️','garden':'🌱',
  'school':'🎓','tutoring':'📖','training':'🎓','music school':'🎵',
  'dance':'💃','gym':'🏋️','yoga':'🧘','martial arts':'🥋','fitness':'🏋️',
  'tailor':'✂️','dressmaker':'✂️','fashion':'👗',
  'law':'⚖️','accounting':'📊','tax':'📊','insurance':'🛡️','real estate':'🏠',
  'architect':'📐','engineer':'⚙️','marketing agency':'📣','consult':'💼',
  'wedding':'💍','event':'🎉','dj':'🎧','photographer':'📷','videographer':'🎥',
  'travel':'✈️','tour':'🗺️','safari':'🦁','hotel':'🏨','guest house':'🏨',
  'lodge':'🏨','resort':'🏖️','hostel':'🏨','airbnb':'🏠',
  'software':'💻','saas':'💻','digital agency':'💻','web developer':'💻',
  'app developer':'📱','graphic design':'🎨',
  'default':'🏪',
};

function icon(cat) {
  if (!cat) return CAT_ICONS.default;
  const c = cat.toLowerCase();
  for (const [k, v] of Object.entries(CAT_ICONS)) {
    if (c.includes(k)) return v;
  }
  return CAT_ICONS.default;
}

// Lightweight mirror of the backend's business-flavor system — used only to
// pick friendlier, more inviting CTA copy than a flat "View Store →" for
// every card regardless of what the business actually does.
const _FOOD_FLAVOR    = ['restaurant','fast food','cafe','café','coffee','bakery','cake','pizza','ice cream','juice','smoothie','food truck','bbq','catering','grocery','butchery','liquor','supermarket'];
const _SERVICE_FLAVOR = ['salon','barber','nail','spa','massage','makeup','tattoo','skincare','beauty','clinic','dental','dentist','pharmacy','optical','physiotherapist','veterinary','wellness','hospital','mechanic','driving school','plumber','electrician','cleaning','pest control','locksmith','renovation','builder','school','tutoring','training','music school','dance','gym','yoga','martial arts','fitness','tailor','dressmaker','law','accounting','tax','insurance','real estate','architect','engineer','marketing agency','consult','wedding','event','dj','photographer','videographer','travel','tour','safari','hotel','guest house','lodge','resort','hostel','airbnb'];

function ctaCopy(cat) {
  const c = (cat || '').toLowerCase();
  if (_FOOD_FLAVOR.some(k => c.includes(k)))    return 'See the Menu';
  if (_SERVICE_FLAVOR.some(k => c.includes(k))) return 'Book Now';
  return 'Shop Now';
}

async function load() {
  try {
    const res  = await fetch(API + '/api/directory');
    const data = await res.json();
    _all = data.businesses || [];
    buildCategories();
    render();
  } catch (e) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><div class="big">⚠️</div>Could not load businesses. Please try again.</div>';
    document.getElementById('nav-count').innerHTML = '<span class="dot" style="background:#ef4444;"></span> Offline';
  }
}

function buildCategories() {
  const counts = {};
  _all.forEach(b => { const c = b.category || 'Other'; counts[c] = (counts[c]||0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort((a,b) => counts[b]-counts[a])];
  const bar = document.getElementById('category-bar');
  bar.innerHTML = cats.map(c => {
    const label = c === 'All' ? `All (${_all.length})` : `${icon(c)} ${c} (${counts[c]})`;
    return `<button class="cat-btn${c==='All'?' active':''}" onclick="setCategory('${esc(c)}', this)">${label}</button>`;
  }).join('');

  document.getElementById('nav-count').innerHTML =
    `<span class="dot"></span> ${_all.length} business${_all.length !== 1 ? 'es' : ''} live`;
}

function setCategory(cat, btn) {
  _active = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function filterBusinesses() { render(); }

function render() {
  const q    = (document.getElementById('search').value || '').toLowerCase();
  const list = _all.filter(b => {
    const matchCat  = _active === 'All' || b.category === _active;
    const matchQ    = !q || b.name.toLowerCase().includes(q) ||
                      (b.category||'').toLowerCase().includes(q) ||
                      (b.tagline||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('biz-count').textContent =
    `${list.length} business${list.length !== 1 ? 'es' : ''} found`;

  if (!list.length) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><div class="big">🔍</div>No businesses found matching your search.<br/>Try a different keyword or category.</div>';
    return;
  }

  document.getElementById('grid').innerHTML = list.map(b => {
    const slug   = b.slug || (b.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const accent = /^#[0-9a-fA-F]{6}$/.test(b.theme_colour || '') ? b.theme_colour : '#22c55e';
    const cta    = ctaCopy(b.category);
    const iconHtml = b.logo_url
      ? `<img src="${esc(b.logo_url)}" alt="${esc(b.name)} logo" loading="lazy" onerror="this.parentElement.textContent='${icon(b.category)}'"/>`
      : icon(b.category);
    return `
      <a class="card" href="/store/${slug}" style="--card-accent:${accent};">
        <div class="card-top">
          <div class="card-icon">${iconHtml}</div>
          <div class="card-heading">
            <div class="card-name">${esc(b.name)}</div>
            <div class="card-category">${esc(b.category||'Business')}</div>
          </div>
          <span class="live-badge"><span class="dot"></span>Live</span>
        </div>
        ${b.tagline ? `<div class="card-tagline">${esc(b.tagline)}</div>` : `<div class="card-tagline">Chat on WhatsApp to see what's on offer.</div>`}
        <span class="card-cta">💬 ${cta} <span class="arrow">→</span></span>
      </a>`;
  }).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
