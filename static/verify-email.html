<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="referrer" content="no-referrer"/>
<title>WaziBot — Confirm Email</title>
<link href="/static/fonts/syne-dm-mono.css" rel="stylesheet"/>
<style>
  :root{
    --bg:#0a0f0d;--surface:#111a15;--border:#1f3025;--green:#22c55e;--red:#ef4444;
    --text:#e8f5e9;--text-dim:#6b8f71;--mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);
        border-radius:16px;padding:40px 36px;}
  .logo{font-size:22px;font-weight:800;color:var(--green);margin-bottom:28px;}
  h1{font-size:22px;font-weight:800;margin-bottom:8px;}
  p{font-size:12px;color:var(--text-dim);font-family:var(--mono);line-height:1.7;margin-bottom:20px;}
  .btn{display:block;width:100%;padding:13px;border-radius:8px;border:none;cursor:pointer;text-align:center;
       font-family:var(--sans);font-size:14px;font-weight:700;background:var(--green);color:#000;text-decoration:none;}
  .btn:hover{opacity:.85;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .msg{font-size:12px;font-family:var(--mono);padding:12px 14px;border-radius:8px;margin-bottom:16px;line-height:1.6;display:none;}
  .msg.success{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green);}
  .msg.error{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);}
</style>
</head>
<body>
<main class="card">
  <div class="logo">WaziBot</div>
  <h1>Confirm your email</h1>
  <p id="intro">One click confirms that this email address belongs to you.</p>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <button id="confirm-btn" class="btn" type="button">Confirm my email</button>
  <a id="dash-link" class="btn" href="/static/dashboard.html" style="display:none;margin-top:12px;">Open my dashboard</a>
</main>
<script src="/static/verify-email.js"></script>
</body>
</html>
